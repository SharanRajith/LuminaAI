<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080812"/>
      <stop offset="100%" stop-color="#13132a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#ff6584"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.85)"/>
    </linearGradient>
    <radialGradient id="orb1" cx="20%" cy="35%" r="40%">
      <stop offset="0%" stop-color="rgba(108,99,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(108,99,255,0)"/>
    </radialGradient>
    <radialGradient id="orb2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="rgba(255,101,132,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,101,132,0)"/>
    </radialGradient>
    <radialGradient id="shine" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#orb1)"/>
  <rect width="1200" height="630" fill="url(#orb2)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Logo icon (centered slightly left) -->
  <rect x="388" y="148" width="148" height="148" rx="36" fill="url(#acc)"/>
  <rect x="388" y="148" width="148" height="148" rx="36" fill="url(#shine)"/>
  <!-- Sparkle inside logo -->
  <path d="M462 172 L468.5 200 L497 208 L468.5 216 L462 244 L455.5 216 L427 208 L455.5 200 Z" fill="white"/>
  <circle cx="462" cy="163" r="5" fill="rgba(255,255,255,0.5)"/>
  <circle cx="506" cy="208" r="5" fill="rgba(255,255,255,0.5)"/>
  <circle cx="462" cy="253" r="5" fill="rgba(255,255,255,0.5)"/>
  <circle cx="418" cy="208" r="5" fill="rgba(255,255,255,0.5)"/>

  <!-- Brand name -->
  <text x="600" y="232" text-anchor="middle"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-size="82" font-weight="900" letter-spacing="-3"
        fill="white">Lumina AI</text>

  <!-- Accent underline bar -->
  <rect x="490" y="252" width="220" height="5" rx="3" fill="url(#acc)"/>

  <!-- Tagline -->
  <text x="600" y="308" text-anchor="middle"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-size="30" font-weight="400"
        fill="rgba(255,255,255,0.5)">AI-Powered Presentations &amp; Reports</text>

  <!-- Feature pills -->
  <rect x="268" y="360" width="148" height="44" rx="22" fill="rgba(108,99,255,0.2)" stroke="rgba(108,99,255,0.4)" stroke-width="1.5"/>
  <text x="342" y="387" text-anchor="middle" font-family="'Inter',Arial,sans-serif" font-size="20" fill="rgba(255,255,255,0.8)">⚡ Instant</text>

  <rect x="432" y="360" width="148" height="44" rx="22" fill="rgba(108,99,255,0.2)" stroke="rgba(108,99,255,0.4)" stroke-width="1.5"/>
  <text x="506" y="387" text-anchor="middle" font-family="'Inter',Arial,sans-serif" font-size="20" fill="rgba(255,255,255,0.8)">🎨 5 Themes</text>

  <rect x="596" y="360" width="148" height="44" rx="22" fill="rgba(108,99,255,0.2)" stroke="rgba(108,99,255,0.4)" stroke-width="1.5"/>
  <text x="670" y="387" text-anchor="middle" font-family="'Inter',Arial,sans-serif" font-size="20" fill="rgba(255,255,255,0.8)">📥 PPTX/PDF</text>

  <rect x="760" y="360" width="172" height="44" rx="22" fill="rgba(108,99,255,0.2)" stroke="rgba(108,99,255,0.4)" stroke-width="1.5"/>
  <text x="846" y="387" text-anchor="middle" font-family="'Inter',Arial,sans-serif" font-size="20" fill="rgba(255,255,255,0.8)">🌐 10 Languages</text>

  <!-- Site URL -->
  <text x="600" y="580" text-anchor="middle"
        font-family="'Inter',Arial,sans-serif"
        font-size="22" fill="rgba(255,255,255,0.25)">luminaai25.netlify.app</text>
</svg>
